name: Performance

# p95 gate (plan.md "Performance Goals", quickstart V9): CRUD <300 ms, client
# search <200 ms, PDF render <500 ms, PDF availability <3 s, plus a budget of
# database round trips per CRUD request.
#
# The suite runs against a Postgres service on the runner, like the
# integration job: GitHub does not let us choose the runner's region, so any
# remote database would measure the runner <-> database distance (60-130 ms
# per query in practice) instead of the app. In production Smart Placement
# (wrangler.jsonc) keeps the Worker next to Neon, so what matters is the app's
# own cost and how many sequential queries each request issues: the round-trip
# budget catches regressions there. End-to-end latency against the deployed
# staging Worker is checked after deploying (docs/operations/deployment-checklist.md).
#
# Not a required PR check: shared runners add timing noise.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC, outside Spanish business hours.
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/performance/**"
      - "tests/integration/database.ts"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/performance.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/performance/**"
      - "tests/integration/database.ts"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Performance (p95 + round trips)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoice_flash_perf
      PERF_REPORT_FILE: ${{ github.workspace }}/perf-results/results.jsonl
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_flash_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run performance suite
        run: |
          mkdir -p perf-results
          pnpm test:performance

      - name: Threshold report
        if: always()
        run: pnpm perf:report perf-results/results.jsonl perf-results/report.md

      - name: Upload threshold report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report-${{ github.run_id }}
          path: perf-results/
          retention-days: 90
